name: Scrappy Continuity Architecture Gate

on:
  pull_request:
  push:
    branches:
      - architecture/syncbond-v5

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,auth]"
      - run: >-
          pytest -q
          tests/test_syncbond.py
          tests/test_experience_ingest.py
          tests/test_research_queue.py
          tests/test_evolution.py
          tests/test_experiment_runner.py
          tests/test_candidate_artifact.py
          tests/test_signed_approval.py
          tests/test_omni_city.py
          tests/test_omni_eval.py
          tests/test_omni_eval_cli.py
          tests/test_omni_evidence.py
